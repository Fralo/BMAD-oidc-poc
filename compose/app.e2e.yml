# compose/app.e2e.yml
# Story 1.12 — `e2e` profile override for the BFF service.
# Story 3.6 — same overlay pattern extended to the Resource Server:
# `ENABLE_TEST_RESET=true` + `TEST_RESET_TOKEN` activate `POST /v1/test/reset`
# (Story 3.4 RS endpoint) and `AUTH_TYPE=oidc_bearer` activates the JWKS-
# validated bearer-token plugin (Story 3.2) so the J4 spec's scope-enforcement
# coverage is real instead of degrading to the archetype's synthetic-admin
# default (`AUTH_TYPE=none`, the unset default on the baseline stack — D142
# deferred follow-up tracks flipping this default).
#
# Applies the `ENABLE_TEST_RESET=true` + `TEST_RESET_TOKEN` env-var pair
# that activates the `POST /v1/test/reset` route (mounted conditionally
# by `bff.api.test_reset.register_test_reset_router` on the BFF, and by
# the equivalent registrar on the RS). The Playwright `resetState(...)`
# fixture (Story 1.11, extended by Story 3.6) authenticates against both
# endpoints via `Authorization: Bearer ${TEST_RESET_TOKEN}` — single token
# reused, no separate `RS_TEST_RESET_TOKEN` (architecture.md §"Operational
# Details" line 1359).
#
# Usage (the `-f` form is required because compose's top-level
# `include:` directive is unconditional — its nominal `profiles:` field
# on `include:` entries is silently ignored, so the
# `${TEST_RESET_TOKEN:?...}` fail-fast would fire on `default` / `dev`
# profile invocations if this file lived in `include:`):
#
#   docker compose \
#     -f docker-compose.yml \
#     -f compose/app.e2e.yml \
#     --profile e2e up
#
# The repo-root `Justfile` wraps that invocation as `just e2e-up` /
# `just e2e-config` so an operator cannot omit the `-f` flag.
#
# The `:?` form on TEST_RESET_TOKEN closes the Story-1.1 D3 concern
# (the `change-me` placeholder accepted silently): if the operator
# forgets to set `TEST_RESET_TOKEN` in their shell or repo-root .env,
# compose refuses to start with a clear error.
services:
  bff:
    environment:
      ENABLE_TEST_RESET: "true"
      TEST_RESET_TOKEN: "${TEST_RESET_TOKEN:?TEST_RESET_TOKEN is required when the e2e profile is up}"

  resource-server:
    environment:
      ENABLE_TEST_RESET: "true"
      TEST_RESET_TOKEN: "${TEST_RESET_TOKEN:?TEST_RESET_TOKEN is required when the e2e profile is up}"
      # Story 3.6 activates oidc_bearer end-to-end (the RS .env.example notes
      # this at line 50-52: "the actual wiring flips in Story 3.3 / 3.6").
      # Without this, the RS runs in AUTH_TYPE=none and treats every caller as
      # an unauthenticated synthetic admin — J4's scope-enforcement coverage
      # would silently degrade.
      AUTH_TYPE: oidc_bearer
