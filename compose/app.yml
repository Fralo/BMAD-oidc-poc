# compose/app.yml
# Included from the top-level docker-compose.yml via the `include:` directive.
# This file owns application-tier services. Story 1.3 lands the BFF; the
# Resource Server arrives in Story 3.1 and the SPA (prod build) in Story 1.8.
#
# Story 1.12: the `e2e` profile flips `ENABLE_TEST_RESET=true` for this
# service via the `compose/app.e2e.yml` OVERRIDE file, applied with the
# explicit `-f` flag pattern. That override is NOT in `include:` because
# compose's `include:` is unconditional (its nominal `profiles:` field
# is silently ignored — verified against compose v5.1.3) so an unconditional
# include would interpolate `${TEST_RESET_TOKEN:?...}` even on the
# `default` profile and also leak `ENABLE_TEST_RESET=true` into the
# non-e2e stack. The repo-root `Justfile` wraps the `-f`-flag invocation
# behind `just e2e-up` / `just e2e-config` so operators cannot forget it.
services:
  bff:
    build:
      # Per-service build context (Story 1.3 closes deferred D4): only the BFF
      # service tree is sent to the daemon; services/bff/.dockerignore prunes
      # tests/, dev-only docs, caches, and .env.* (except .env.example).
      context: ../services/bff
    container_name: bff
    # Story 1.12 (done): ENABLE_TEST_RESET=true and TEST_RESET_TOKEN are
    # injected for the e2e profile via compose/app.e2e.yml applied with the
    # explicit `-f` flag pattern (see repo-root Justfile). This service block
    # is intentionally free of ENABLE_TEST_RESET so the default/dev profiles
    # do not register the test-reset route.
    env_file:
      - ../services/bff/.env
    ports:
      # Expose :8000 to the host. Required for the browser-side OIDC redirect
      # (Story 1.5) to land on the BFF at http://localhost:8000/auth/callback
      # and for `dev`-profile workflows where the SPA's ng-serve proxy
      # forwards /auth, /api, /v1 to http://localhost:8000.
      - "8000:8000"
    volumes:
      - bff_data:/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # Compose-level healthcheck overrides the image-level one. Uses the
      # stdlib (no curl/wget in python:3.14-slim) — same probe as the BFF's
      # /health endpoint exposes. Single-line form mirrors Dockerfile
      # HEALTHCHECK to avoid YAML folded-scalar fragility on edits.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    profiles: [default, dev, e2e]
    restart: unless-stopped

  playwright:
    # Story 1.11: Playwright runner for the `e2e` compose profile.
    # One-shot container that executes the E2E specs against the live stack
    # and exits. Depends on BFF + Keycloak healthchecks so tests only start
    # after the OIDC + session machinery is reachable.
    #
    # Story 1.13 adds three env vars used exclusively by the J5 spec's
    # refresh-token revocation assertion: it captures the refresh_token via
    # `GET /v1/test/session-debug` (BFF, gated by ENABLE_TEST_RESET), then
    # POSTs it back to Keycloak's /token endpoint with grant_type=refresh_token
    # and asserts `error=invalid_grant` — wire-level proof that BFF
    # /auth/logout revoked at the AS (Story 1.7).
    build:
      context: ../e2e
    container_name: playwright
    depends_on:
      bff:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    environment:
      # Override the helpers' default of http://localhost:8000 so the runner
      # reaches the BFF via the compose network (where `localhost` would be
      # the runner container itself).
      E2E_BASE_URL: http://bff:8000
      # Forwarded from the root `.env`; used by `resetState` helper. Story
      # 1.12 will register the BFF-side /v1/test/reset endpoint that this
      # token authenticates against.
      TEST_RESET_TOKEN: ${TEST_RESET_TOKEN}
      # Story 1.13: J5 refresh-token revocation assertion. OIDC_CLIENT_ID is
      # the Keycloak client the BFF authenticates as; BFF_CLIENT_SECRET is
      # required because the `bmad-books-bff` client is confidential (a
      # refresh request without the secret returns 400 invalid_client instead
      # of invalid_grant); KEYCLOAK_INTERNAL_URL is the compose-network URL
      # of Keycloak (browser-facing http://localhost:8080 is unreachable from
      # inside the runner container).
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-bmad-books-bff}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?BFF_CLIENT_SECRET is required when the e2e profile is up}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
    volumes:
      # Persist trace/screenshot/video artifacts to the host after a run.
      - ../e2e/test-results:/e2e/test-results
    profiles: [e2e]
    restart: "no"

volumes:
  # Persists the BFF's SQLite file across container recreation; destroyed by
  # `docker compose down -v`. Per AR6 (architecture §I5).
  bff_data: {}
