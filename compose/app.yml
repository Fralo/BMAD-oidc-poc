# compose/app.yml
# Included from the top-level docker-compose.yml via the `include:` directive.
# This file owns application-tier services. Story 1.3 lands the BFF; the
# Resource Server arrives in Story 3.1; Story 6.2 splits the SPA out of the
# BFF image into its own `spa` SSR-edge service (Angular 21 SSR on Node 22
# via Express, with `http-proxy-middleware` reverse-proxying `/auth /api /v1`
# to the BFF on the compose network); Story 6.3 finalizes the split by
# deleting the BFF's Story-1.14 static-serve code path and reverting the BFF
# build context to per-service — the BFF is now API-only.
#
# Post-Epic-6 topology: the browser-facing host port is `:${SPA_HOST_PORT:-4000}`
# (the SPA edge); the BFF has NO host port and is reachable only on the
# compose network as `http://bff:8000`.
#
# D140/D141 (smoke follow-up): `bff`, `resource-server`, and now `spa` have
# no `profiles:` field — they are part of the unconditional baseline so
# bare `docker compose up` brings them up. The retired `default` / `dev`
# profiles produced identical containers. Host-side `cd spa && npm start`
# was retired with Story 6.1's deletion of `spa/proxy.conf.json`; the
# containerized SPA edge is the documented dev path. Only the `e2e` profile
# still scopes a service — the `playwright` runner below.
# D141: per-service `services/<svc>/.env` files retired; both services now
# load `../.env` (the repo-root single source) and bake topology constants
# (OIDC URLs, base URLs, DB paths, APP_NAME) into `environment:` blocks here.
#
# Story 1.12: the `e2e` profile flips `ENABLE_TEST_RESET=true` for these
# services via the `compose/app.e2e.yml` OVERRIDE file, applied with the
# explicit `-f` flag pattern. That override is NOT in `include:` because
# compose's `include:` is unconditional (its nominal `profiles:` field
# is silently ignored — verified against compose v5.1.3) so an unconditional
# include would interpolate `${TEST_RESET_TOKEN:?...}` even outside the e2e
# profile. The repo-root `Justfile` wraps the `-f`-flag invocation behind
# `just e2e-up` / `just e2e-config` so operators cannot forget it.
services:
  bff:
    build:
      # Story 6.3: per-service context restored — the front-end build stage
      # was removed and the BFF no longer needs to reach a sibling directory.
      # The repo-root `.dockerignore` is no longer consulted for this build;
      # `services/bff/.dockerignore` becomes load-bearing again.
      context: ../services/bff
    container_name: bff
    # Story 1.12 wired ENABLE_TEST_RESET=true and TEST_RESET_TOKEN via
    # the `compose/app.e2e.yml` overlay (applied with `-f` flag, NOT via
    # `include:` — see file header for rationale). The `resetState` helper
    # from Story 1.11 authenticates against POST /v1/test/reset using that
    # token; calls to the endpoint outside the e2e profile return 404
    # (route not mounted when ENABLE_TEST_RESET is absent/false).
    env_file:
      - ../.env
    environment:
      # D141: topology constants previously in services/bff/.env now live
      # here. The root `.env` carries only operator-edited values (secrets +
      # overrides); compose-network URLs, ports, and archetype defaults are
      # not operator-tunable so they belong with the service definition.
      APP_NAME: bff
      DEBUG: "false"
      BFF_DATABASE_URL: sqlite+aiosqlite:////data/bff.db
      # Story 6.2: BFF_BASE_URL is the BROWSER-facing URL. The BFF reads it
      # at `services/bff/src/bff/api/auth.py:149,232` to construct the OAuth
      # `redirect_uri` Keycloak echoes to the browser; `services/bff/src/bff/
      # auth/csrf.py:102` anchors the CSRF Origin check on it. Both must use
      # the SPA edge URL because the browser only ever sees `:${SPA_HOST_PORT:-4000}`
      # after this story — it never connects directly to the BFF. Do NOT
      # change this to `http://bff:8000`; that's what the SPA proxy uses
      # internally (set via `BFF_INTERNAL_URL` on the `spa` service below).
      BFF_BASE_URL: http://localhost:${SPA_HOST_PORT:-4000}
      RS_BASE_URL: http://resource-server:8000
      # BFF's OIDC_ISSUER_URL is the back-channel URL used by Authlib for
      # token exchange against Keycloak via compose DNS. The RS service uses
      # a different (host-facing) value below — same env var name, different
      # correct value per consumer, because Keycloak's KC_HOSTNAME=localhost
      # makes the signed `iss` claim host-facing while back-channel calls
      # need the compose-DNS hostname.
      OIDC_ISSUER_URL: http://keycloak:8080/realms/bmad-books
      OIDC_JWKS_URL: http://keycloak:8080/realms/bmad-books/protocol/openid-connect/certs
      OIDC_AUDIENCE: bmad-books-resource-server
      OIDC_CLIENT_ID: bmad-books-bff
      OIDC_AUTHORIZE_URL_BROWSER: http://localhost:8080/realms/bmad-books
      BFF_SESSION_COOKIE_NAME: bff_session
      BFF_CSRF_COOKIE_NAME: csrf_token
    # Story 6.2: the BFF no longer publishes a host port. The browser-facing
    # `redirect_uri` now lands on the SPA SSR edge (`:${SPA_HOST_PORT:-4000}`),
    # which reverse-proxies `/auth/callback` to the BFF on the compose network
    # via `http://bff:8000`. Story 6.3 deleted the Story-1.14 SPA static-serve
    # code path from the BFF image; the BFF is now API-only.
    volumes:
      - bff_data:/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # Compose-level healthcheck overrides the image-level one. Uses the
      # stdlib (no curl/wget in python:3.14-slim) — same probe as the BFF's
      # /health endpoint exposes. Single-line form mirrors Dockerfile
      # HEALTHCHECK to avoid YAML folded-scalar fragility on edits.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  resource-server:
    # Story 3.1: Resource Server. Internal-only — the BFF reaches it at
    # http://resource-server:8000 via Docker DNS. NO `ports:` block is
    # published to the host (architecture §F3 + §I6: only the BFF container
    # exposes a user-facing port). Under the `e2e` profile the
    # `compose/app.e2e.yml` overlay activates `ENABLE_TEST_RESET=true` +
    # `TEST_RESET_TOKEN` (for `POST /v1/test/reset`, Story 3.4) and flips
    # `AUTH_TYPE=oidc_bearer` (Story 3.2 plugin). The real `killRs`/`startRs`
    # helper implementations live in `e2e/fixtures/services.ts` and shell out
    # to `docker compose stop|start resource-server` via the host docker
    # socket bound into the playwright runner.
    #
    # The BFF's existing `depends_on` is intentionally NOT modified — per
    # FR-ERROR-01 / J6, when the RS is down the BFF must surface
    # `errorCode: resource_server_unavailable` honestly rather than refuse
    # to start (Story 3.5 will land the `ResourceServerClient` that owns
    # this honest-failure surface).
    build:
      # Root build context for consistency with the BFF post-1.14 posture
      # (closes D4 for the RS). The root .dockerignore applies;
      # services/resource-server/.dockerignore is unused with a root context
      # but kept for documentation parity.
      context: ..
      dockerfile: services/resource-server/Dockerfile
    container_name: resource-server
    env_file:
      - ../.env
    environment:
      # D141: topology constants previously in services/resource-server/.env
      # now live here. RS's OIDC_ISSUER_URL is the host-facing value (matches
      # the `iss` claim Keycloak signs into tokens under KC_HOSTNAME=localhost
      # — see compose/infra.yml:19). OIDC_JWKS_URL is back-channel because
      # JWKS is fetched server-side via compose DNS. AUTH_TYPE is left at the
      # archetype default (none); the `e2e` overlay flips it to `oidc_bearer`
      # for scope-enforcement coverage. D142 is the deferred follow-up for
      # flipping AUTH_TYPE=oidc_bearer on the default stack.
      APP_NAME: resource-server
      DEBUG: "false"
      RS_DATABASE_URL: sqlite+aiosqlite:////data/rs.db
      OIDC_ISSUER_URL: http://localhost:8080/realms/bmad-books
      OIDC_JWKS_URL: http://keycloak:8080/realms/bmad-books/protocol/openid-connect/certs
      OIDC_AUDIENCE: bmad-books-resource-server
    volumes:
      - rs_data:/data
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      # Stdlib probe (no curl in python:3.14-slim). Single-line CMD list
      # form mirrors the BFF healthcheck per Story 1.3 review patch P11;
      # folded-scalar YAML form is forbidden.
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  spa:
    # Story 6.2: SPA SSR edge. Angular 21 SSR Express server (Story 6.1's
    # `dist/spa/server/server.mjs`) running on Node 22, owning the browser-
    # facing host port. Mounts `http-proxy-middleware` at `/auth /api /v1`
    # so the BFF stays internal-only on the compose network. The SPA's
    # `provideAppInitializer` issues an SSR-side `/api/me` call that
    # rewrites to `${BFF_INTERNAL_URL}/api/me` and forwards the inbound
    # `Cookie` header — see Story 6.1 §"SSR /api/me chain" for the full
    # composition. No CSP middleware here at 6.2 close; Story 6.4 moves
    # CSP source BFF → SPA per architecture A8 amendment.
    build:
      # Per-service context — keeps the SPA build context to ~5 MB after
      # spa/.dockerignore (vs ~250 MB for a root context). Story 6.2 Dev
      # Notes §"Why the SPA build context is `../spa`" rationale.
      context: ../spa
      dockerfile: Dockerfile
    container_name: spa
    # Story 6.2 code-review P2: Node-as-PID-1 footgun. The ENTRYPOINT
    # `node dist/spa/server/server.mjs` makes Node PID 1; Node has no
    # default SIGTERM handler, so `docker stop` waits the full 10 s grace
    # before SIGKILL and in-flight SSR streams are aborted. `init: true`
    # makes compose run the container with `--init` (Docker's tini-style
    # PID-1) which reaps zombies and forwards SIGTERM to Node. Cheaper
    # than wiring a custom signal handler in `spa/src/server.ts`, and
    # doesn't reach into Story 6.1's territory.
    init: true
    environment:
      NODE_ENV: production
      PORT: "4000"
      # Compose-DNS URL the SSR Express proxy forwards `/auth /api /v1` to
      # AND the absolute base the SSR `ssr-api-url.interceptor.ts` rewrites
      # browser-relative `/api/me` paths to during render. NOT host-facing.
      BFF_INTERNAL_URL: http://bff:8000
      # Browser-facing origin — right-hand side of Angular's
      # `HTTP_TRANSFER_CACHE_ORIGIN_MAP` (Story 6.1 `app.config.server.ts:13`)
      # so the SSR transfer cache key (absolute) matches the browser-side
      # key (relative). Must equal `BFF_BASE_URL` on the BFF service.
      SPA_PUBLIC_ORIGIN: http://localhost:${SPA_HOST_PORT:-4000}
    ports:
      # `SPA_HOST_PORT` defaults to 4000; override via repo-root `.env`
      # (see `.env.example`). Container port is fixed at 4000 (matches
      # `PORT` env + Dockerfile EXPOSE + healthcheck probe URL).
      - "${SPA_HOST_PORT:-4000}:4000"
    depends_on:
      # SPA only needs the BFF reachable to start serving. The BFF already
      # transitively gates on Keycloak (`bff.depends_on.keycloak`), so the
      # SPA inherits the full ordering without adding a direct Keycloak
      # dependency.
      bff:
        condition: service_healthy
    healthcheck:
      # Node 22's global `fetch` against `/_health` (Story 6.1
      # `spa/src/server.ts:34–36`). Single-line CMD list form mirrors the
      # BFF healthcheck pattern per Story 1.3 review patch P11 — folded-
      # scalar YAML form is forbidden in this project.
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/_health').then(r => process.exit(r.ok ? 0 : 1)).catch(e => { console.error('healthcheck:', e && e.message || e); process.exit(1); })"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  playwright:
    # Story 1.11: Playwright runner for the `e2e` compose profile.
    # One-shot container that executes the E2E specs against the live stack
    # and exits. Depends on BFF + Keycloak healthchecks so tests only start
    # after the OIDC + session machinery is reachable.
    #
    # Story 1.13 adds three env vars used exclusively by the J5 spec's
    # refresh-token revocation assertion: it captures the refresh_token via
    # `GET /v1/test/session-debug` (BFF, gated by ENABLE_TEST_RESET), then
    # POSTs it back to Keycloak's /token endpoint with grant_type=refresh_token
    # and asserts `error=invalid_grant` — wire-level proof that BFF
    # /auth/logout revoked at the AS (Story 1.7).
    build:
      context: ../e2e
    container_name: playwright
    depends_on:
      bff:
        condition: service_healthy
      keycloak:
        condition: service_healthy
      resource-server:
        condition: service_healthy
      # Story 6.4: the browser-facing origin is the SPA SSR edge, not the BFF.
      # Without this dependency the playwright runner can start before the SPA
      # container is healthy and J1's first navigation to ${E2E_BASE_URL}/login
      # would race against the SPA container's startup (the SPA's `/_health`
      # healthcheck flips green within ~15s of start; see compose/app.yml
      # `spa.healthcheck`).
      spa:
        condition: service_healthy
    environment:
      # Story 6.4 / Epic-6 close: the browser-facing origin is the SPA SSR
      # edge (`spa:4000` on the compose network, `localhost:4000` from the
      # browser's perspective after the chromium `--host-resolver-rules`
      # remap). The SPA SSR Express server reverse-proxies `/auth /api /v1`
      # to the BFF over compose DNS via `http-proxy-middleware`; the BFF no
      # longer publishes a host port (Story 6.2 dropped it) and is internal-
      # only. Cookies stay domain-scoped on `localhost:4000` — the state
      # cookie set on the SPA load and the BFF-set `bff_session` / `csrf_token`
      # cookies (forwarded byte-for-byte by the SSR proxy) all share that
      # browser-facing host. Keycloak's registered redirect_uri for the
      # `bmad-books-bff` client is `http://localhost:${SPA_HOST_PORT:-4000}/auth/callback`
      # (Story 6.2 realm flip), so the OAuth callback also lands at `:4000`.
      E2E_BASE_URL: http://localhost:4000
      # Playwright's `request` fixture uses Node networking, NOT Chromium — so
      # it does not honor `--host-resolver-rules`. The Node-side `resetState`
      # helper POSTs `/v1/test/reset` directly at the BFF via compose DNS,
      # sidestepping the SPA edge entirely (the SPA proxy WOULD forward `/v1`
      # paths, but `resetState` is test-state plumbing and we want a direct
      # back-channel that doesn't depend on the edge being up). Keep this
      # value at `http://bff:8000` regardless of the browser-side flip.
      BFF_BASE_URL: http://bff:8000
      # Forwarded from the root `.env`; used by `resetState` helper. Story
      # 1.12 will register the BFF-side /v1/test/reset endpoint that this
      # token authenticates against.
      TEST_RESET_TOKEN: ${TEST_RESET_TOKEN}
      # Story 1.13: J5 refresh-token revocation assertion. OIDC_CLIENT_ID is
      # the Keycloak client the BFF authenticates as; BFF_CLIENT_SECRET is
      # required because the `bmad-books-bff` client is confidential (a
      # refresh request without the secret returns 400 invalid_client instead
      # of invalid_grant); KEYCLOAK_INTERNAL_URL is the compose-network URL
      # of Keycloak (browser-facing http://localhost:8080 is unreachable from
      # inside the runner container).
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-bmad-books-bff}
      BFF_CLIENT_SECRET: ${BFF_CLIENT_SECRET:?BFF_CLIENT_SECRET is required when the e2e profile is up}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      # Story 3.6: `resetState`'s RS-side POST targets the Resource Server
      # on the compose network. Helper defaults to this same value when
      # the env var is unset (host-side workflow has its own constraints —
      # see e2e/README.md "RS killswitch (J4 + J6)").
      RS_BASE_URL: http://resource-server:8000
      # Story 3.6: pin Compose v2's project-name prefix so `docker compose
      # stop|start resource-server` (issued from inside the runner via the
      # bound docker socket) targets the right container. Without this, the
      # runner's working directory `/e2e` would yield project name `e2e` and
      # the lookup would resolve to nothing.
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-bmad-books}
    volumes:
      # Persist trace/screenshot/video artifacts to the host after a run.
      - ../e2e/test-results:/e2e/test-results
      # Docker-socket bind: enables killRs/startRs via host daemon. Trusted local-only; production hardening is Story 5.2 territory.
      - /var/run/docker.sock:/var/run/docker.sock
    profiles: [e2e]
    restart: "no"

volumes:
  # Persists the BFF's SQLite file across container recreation; destroyed by
  # `docker compose down -v`. Per AR6 (architecture §I5).
  bff_data: {}
  # Story 3.1: persists the RS's SQLite file (rs.db) across container
  # recreation; destroyed by `docker compose down -v`. Per AR6 (§I5) the
  # RS keeps its own named volume separate from the BFF's `bff_data` —
  # the two services share no on-disk state.
  rs_data: {}
