# docker-compose.yml
# Top-level entry point. Composition is split into two included files so each
# tier stays small and reviewable; later stories add services into them.
#   - compose/infra.yml  : Keycloak (Story 1.2)
#   - compose/app.yml    : BFF / Resource Server / SPA (Stories 1.3, 1.8, 3.1)
#
# Three profiles are declared here (per architecture I2 / epics AR26):
#   - default : full stack (Keycloak + BFF + RS + SPA)
#   - dev     : backend-only; SPA is run on the host with `ng serve`
#   - e2e     : full stack + Playwright runner with test-reset endpoints enabled
#
# The `x-profiles` extension below is an inert documentation anchor that
# survives `docker compose config`. Subsequent stories will attach real
# `profiles: [...]` blocks to each service they add.
include:
  - compose/infra.yml
  - compose/app.yml

x-profiles: [default, dev, e2e]
