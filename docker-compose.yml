# docker-compose.yml
# Top-level entry point. Composition is split into two included files so each
# tier stays small and reviewable.
#   - compose/infra.yml  : Keycloak                         (Story 1.2)
#   - compose/app.yml    : BFF, Resource Server, SPA (prod) (Stories 1.3, 3.1, 1.8)
#
# Three profiles (architecture I2 / epics AR26):
#   - default : full stack (Keycloak + BFF + RS + SPA)
#   - dev     : backend-only; SPA is run on the host with `ng serve`
#   - e2e     : full stack + Playwright runner with test-reset endpoints enabled
#
# Profile attachment is per-service: each service declares its own
# `profiles: [...]` block. Story 1.2 (Keycloak) and Story 1.3 (BFF) carry
# real profiles now, so the inert `x-profiles:` documentation anchor that
# Story 1.1 used as a placeholder is no longer needed and has been removed.
include:
  - compose/infra.yml
  - compose/app.yml
