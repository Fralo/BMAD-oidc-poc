# docker-compose.yml
# Top-level entry point. Composition is split into two included files so each
# tier stays small and reviewable.
#   - compose/infra.yml  : Keycloak                         (Story 1.2)
#   - compose/app.yml    : BFF, Resource Server             (Stories 1.3, 3.1)
#                          + SPA bundle baked into the BFF image (Story 1.14)
#
# Profile model (D140 follow-up): one profile, `e2e`, scopes the Playwright
# runner only. Bare `docker compose up` brings up the full baseline stack
# (Keycloak + BFF + RS). The retired `default` / `dev` profiles produced
# identical containers; the "dev" workflow is `docker compose up` plus
# `cd spa && npm start` on the host, which needs no compose-side gating.
# The e2e workflow stays behind `just e2e-up` (the `-f compose/app.e2e.yml`
# overlay applies the test-reset env vars and flips RS AUTH_TYPE=oidc_bearer).
include:
  - compose/infra.yml
  - compose/app.yml
