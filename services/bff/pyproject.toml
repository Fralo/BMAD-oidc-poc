[project]
name = "bff"
version = "0.0.2"
description = "BMAD_books Backend-for-Frontend (OAuth client, books domain)"
readme = "README.md"
authors = [
    { name = "BMAD_books contributors", email = "noreply@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    # opentelemetry-api only (no SDK, no exporters, no FastAPI instrumentation).
    # Used by observability/logging.py to read the current span context for
    # log-record correlation; with no SDK/provider configured, get_current_span
    # returns a NonRecordingSpan and trace_id/span_id render as the configured
    # sentinels — i.e. the API stays inert per AC4 (no /metrics, no exporter).
    "opentelemetry-api>=1.39.1",
    "pydantic-settings>=2.13.1",
    "structlog>=24.0.0",
    "sqlmodel>=0.0.37",
    "uvicorn>=0.41.0",
    "aiosqlite>=0.22.1",
    "greenlet>=3.3.2",
    "alembic>=1.18.4",
    "authlib>=1.6.0",
    "pyjwt[crypto]>=2.10.0",
    "itsdangerous>=2.2.0",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb",
    "nest-asyncio>=1.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "respx>=0.21.0",
    "ruff>=0.15.4",
    "ty",
]

[tool.ruff]
target-version = "py314"
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends"]

[tool.ruff.lint.isort]
known-first-party = ["bff"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -ra"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true
