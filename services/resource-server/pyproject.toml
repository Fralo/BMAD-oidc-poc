[project]
name = "resource-server"
version = "0.0.2"
description = "BMAD_books Resource Server (reading speed, estimate)"
readme = "README.md"
authors = [
    { name = "BMAD_books contributors", email = "noreply@example.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "opentelemetry-api>=1.39.1",
    "opentelemetry-exporter-otlp>=1.39.1",
    "opentelemetry-instrumentation-fastapi>=0.60b1",
    "opentelemetry-sdk>=1.39.1",
    "prometheus-fastapi-instrumentator>=7.1.0",
    "pydantic-settings>=2.13.1",
    "PyJWT[crypto]>=2.9.0",
    "structlog>=24.0.0",
    "pymysql>=1.1.2",
    "sqlmodel>=0.0.37",
    "uvicorn>=0.41.0",
    "aiosqlite>=0.22.1",
    "aiomysql>=0.3.2",
    "greenlet>=3.3.2",
    "alembic>=1.18.4",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipdb",
    "nest-asyncio>=1.6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "ruff>=0.15.4",
    "ty",
]

[tool.ruff]
target-version = "py314"
src = ["src"]
line-length = 88

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "N",     # pep8-naming
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "Depends"]

[tool.ruff.lint.isort]
known-first-party = ["resource_server"]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--strict-markers -ra"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src"]
# Story 3.1 carve-out (mirrors BFF Story 1.3 dev log lines 455–462):
#  - **/mock_*.py: archetype-emitted mock helpers (dead in production).
#  - auth/entra.py: archetype's Azure-AD bearer module (~150 LOC, ~38%
#    covered out of the box). The RS will replace this with `oidc_bearer.py`
#    in Story 3.2 (architecture §A2 — PyJWT + PyJWKClient validating
#    Keycloak JWTs). Until then, exercising entra's full surface here
#    would be busywork that gets deleted in 3.2.
#  - observability/otel.py, observability/prometheus.py: archetype-emitted
#    OTEL exporter + Prometheus scrape wiring. Per the 2026-05-14
#    sprint-change cut + AR1 archetype-mandate note, these are kept on
#    disk for documentation parity but never invoked from main.py. Their
#    full-coverage exercise would re-introduce the observability surface
#    the project explicitly removed.
#  - core/constants.py, factories/__init__.py, models/dto/__init__.py,
#    models/dto/v1/__init__.py: archetype-emitted module-level constants
#    that were demo-only. Each is a thin pass-through with no behavior
#    consumed by Story 3.1's surface (Story 3.3 will populate the
#    models/dto/v1/ tree with real DTOs).
omit = [
    "**/mock_*.py",
    "src/resource_server/auth/entra.py",
    "src/resource_server/observability/otel.py",
    "src/resource_server/observability/prometheus.py",
    "src/resource_server/core/constants.py",
    "src/resource_server/factories/__init__.py",
    "src/resource_server/models/dto/__init__.py",
    "src/resource_server/models/dto/v1/__init__.py",
]

[tool.coverage.report]
fail_under = 90
show_missing = true
